services:
  jenkins:
    build:
      context: ./docker/jenkins
    container_name: parabank-jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - parabank-network
    depends_on:
      selenium-chrome:
        condition: service_healthy

  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: parabank-selenium
    shm_size: 2gb
    ports:
      - "4444:4444"
    networks:
      - parabank-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:4444/status || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  jenkins_home:

networks:
  parabank-network:
    driver: bridge